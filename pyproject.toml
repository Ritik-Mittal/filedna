[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "filedna"
version = "1.2.6"
description = "Discover a file's true identity."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "FileDNA Contributors" },
]
keywords = ["file", "detection", "validation", "metadata", "mime", "magic-bytes"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Utilities",
]

dependencies = [
  "pydantic>=2.0",
  "click>=8.0",
  "filetype>=1.2",
  "puremagic>=1.15",
  "pdfplumber>=0.10",
  "python-docx>=1.0",
  "python-pptx>=0.6",
  "openpyxl>=3.1",
  "Pillow>=10.0",
  "mutagen>=1.47",
  "langdetect>=1.0",
  "tiktoken>=0.5",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/Ritik-Mittal/filedna"
Documentation = "https://github.com/Ritik-Mittal/filedna#readme"
Repository = "https://github.com/Ritik-Mittal/filedna"
Issues = "https://github.com/Ritik-Mittal/filedna/issues"

[project.scripts]
filedna = "filedna.cli.commands:main"

[project.optional-dependencies]
ai = [
  "litellm>=1.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.10",
  "litellm>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["filedna"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
]
ignore = [
  "E501",  # line length handled by formatter
  "B006",  # mutable default args — handled by dataclass field()
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # allow assert in tests

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
